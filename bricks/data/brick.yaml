name: data
description: Scaffold a data layer that follows the repo conventions (data source, provider triple).
version: 1.0.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  name:
    type: string
    description: Package name (snake_case), e.g. history_data.
    default: my_feature_data
    prompt: Package name?
  classname:
    type: string
    description: Feature name (snake_case), e.g. history.
    default: my_feature
    prompt: Feature name?
  domainPackage:
    type: string
    description: Name of the domain package whose contracts this layer implements.
    default: my_feature_domain
    prompt: Domain package name?
  repository:
    type: string
    description: >
      The contract this data source implements, without the Repository suffix — e.g. `player`
      for PlayerRepository. It is often NOT the feature name: settings_data implements
      PlayerRepository, history_data implements HistoryRepository.
    default: my_feature
    prompt: Repository name (without the Repository suffix)?
