name: design_components
description: Design-system components — the widgets shared by more than one feature, with their states.
version: 1.0.0

environment:
  flutter: ">=3.27.0"
  sdk: ">=3.11.0 <4.0.0"
resolution: workspace

dependencies:
  design_tokens:
  flutter:
    sdk: flutter
  # Renders the shipped SVGs (the nine-square mark, the bunny pair, the close icon). Its
  # ColorMapper is what remaps the artwork's three baked-in fills onto the active theme.
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  givn:
  shouldly: ^0.5.0+1
